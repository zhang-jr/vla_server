[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-runtime"
version = "0.1.0.dev0"
description = "Multi-robot policy serving for action-chunking VLA models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["vla", "robotics", "inference", "serving", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0",
    "pydantic>=2.0",
    "msgpack>=1.0",
]

[project.optional-dependencies]
# Closed-loop sim benchmarks (benchmarks/sim) — remote GPU host only.
# SmolVLA comes from LeRobot (processor API, 0.4+); LIBERO via LeRobot's extra.
sim-libero = ["lerobot[smolvla,libero]>=0.4"]
sim-maniskill = ["lerobot[smolvla]>=0.4", "mani-skill>=3.0.0b20"]

# Testing
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
]

# Full development environment
dev = [
    "vla-runtime[test]",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.urls]
Repository = "https://github.com/youran-lab/vla-runtime"

# ── Tool configuration ────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["vla_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "gpu: requires a CUDA-capable GPU",
    "slow: slow tests (> 10s)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]   # long lines handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
